  <!-- trend line -->
  <path d="M 60 260 L 150 240 L 230 270 L 310 200 L 390 220 L 470 140 L 560 100 L 630 60" fill="none" stroke="url(#ttLine)" stroke-width="3" stroke-linecap="round"/>

  <text x="60" y="270" fill="#F4F8F6" font-size="44" font-weight="700" letter-spacing="1">TrueTrader</text>
  <text x="60" y="312" fill="#9FE8D2" font-size="17" font-family="'Helvetica Neue', Arial, sans-serif" letter-spacing="3">AI TRADING JOURNAL &amp; ANALYTICS</text>
</svg>
