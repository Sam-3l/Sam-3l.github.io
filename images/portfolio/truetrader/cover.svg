    <rect x="530" y="130" width="10" height="35" fill="#F4716C"/>
    <line x1="535" y1="118" x2="535" y2="175" stroke="#F4716C" stroke-width="2"/>
    <rect x="555" y="70" width="10" height="50" fill="#2ED9A0"/>
    <line x1="560" y1="55" x2="560" y2="130" stroke="#2ED9A0" stroke-width="2"/>
