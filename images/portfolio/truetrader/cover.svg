  </defs>
  <rect width="700" height="394" fill="url(#ttBg)"/>

  <!-- grid lines -->
  <g stroke="#1E3A4A" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="700" y2="90"/>
    <line x1="0" y1="160" x2="700" y2="160"/>
    <line x1="0" y1="230" x2="700" y2="230"/>
    <line x1="0" y1="300" x2="700" y2="300"/>
  </g>

  <!-- candlesticks -->
  <g>
    <rect x="430" y="150" width="10" height="40" fill="#2ED9A0"/>
    <line x1="435" y1="135" x2="435" y2="200" stroke="#2ED9A0" stroke-width="2"/>
    <rect x="455" y="120" width="10" height="55" fill="#2ED9A0"/>
    <line x1="460" y1="105" x2="460" y2="185" stroke="#2ED9A0" stroke-width="2"/>
    <rect x="480" y="160" width="10" height="30" fill="#F4716C"/>
    <line x1="485" y1="150" x2="485" y2="200" stroke="#F4716C" stroke-width="2"/>
    <rect x="505" y="95" width="10" height="60" fill="#2ED9A0"/>
