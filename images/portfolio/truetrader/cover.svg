<svg viewBox="0 0 700 394" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="ttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C2C"/>
      <stop offset="100%" stop-color="#0A2B26"/>
    </linearGradient>
    <linearGradient id="ttLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ED9A0"/>
      <stop offset="100%" stop-color="#67E8F9"/>
